name: Build and Push Docker Image

# Runs on every push to main — this is the trigger you'll show live on camera.
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the repo's code onto the GitHub-hosted runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub using repo secrets (never hardcode credentials)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Set up QEMU so the runner can build for architectures other than its own (needed for arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 4. Set up Buildx (enables caching + multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build the image for both amd64 and arm64, and push it straight to Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max